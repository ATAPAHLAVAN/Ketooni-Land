{% extends 'shop/base.html' %}
{% block title %}فراموشی رمز عبور{% endblock %}
{% block content %}
<div style="min-height: calc(100vh - 200px); display:flex; align-items:center; justify-content:center; padding:40px; background: linear-gradient(-45deg, #0a0e14, #1a202c, #2c1a3d, #1a202c); background-size:300% 300%; animation: gradientShiftPR 12s ease infinite;">
<style>@keyframes gradientShiftPR{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}</style>
<div style="background:white; border-radius:20px; padding:50px; max-width:450px; width:100%; box-shadow:0 25px 70px rgba(139,92,246,0.3);">
    <h1 style="font-size:1.8rem; font-weight:950; color:#1a202c; margin-bottom:10px;">فراموشی <span style="background:linear-gradient(135deg,#8B5CF6,#FFB800);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">رمز عبور</span></h1>
    <p style="color:#718096; margin-bottom:25px;">ایمیل خود را وارد کنید تا لینک بازیابی برایتان ارسال شود</p>
    <form method="POST">
        {% csrf_token %}
        <input type="email" name="email" placeholder="ایمیل خود را وارد کنید" required
               style="width:100%; padding:13px 16px; border:2px solid #e2e8f0; border-radius:12px; margin-bottom:20px; font-size:0.95rem;">
        <button type="submit" style="width:100%; padding:15px; background:linear-gradient(135deg,#8B5CF6,#FFB800); color:white; border:none; border-radius:12px; font-weight:950; cursor:pointer; font-size:1rem;">
            ارسال لینک بازیابی
        </button>
    </form>
</div>
</div>
{% endblock %}
