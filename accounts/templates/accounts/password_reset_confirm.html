{% extends 'shop/base.html' %}
{% block title %}تعیین رمز جدید{% endblock %}
{% block content %}
<div style="min-height: calc(100vh - 200px); display:flex; align-items:center; justify-content:center; padding:40px;">
<div style="background:white; border-radius:20px; padding:50px; max-width:450px; width:100%; box-shadow:0 15px 40px rgba(0,0,0,0.1);">
    <h1 style="font-size:1.6rem; font-weight:900; color:#1a202c; margin-bottom:20px;">تعیین رمز جدید</h1>
    {% if validlink %}
    <form method="POST">
        {% csrf_token %}
        <input type="password" name="new_password1" placeholder="رمز عبور جدید" required
               style="width:100%; padding:13px 16px; border:2px solid #e2e8f0; border-radius:12px; margin-bottom:15px;">
        <input type="password" name="new_password2" placeholder="تکرار رمز عبور جدید" required
               style="width:100%; padding:13px 16px; border:2px solid #e2e8f0; border-radius:12px; margin-bottom:20px;">
        <button type="submit" style="width:100%; padding:15px; background:linear-gradient(135deg,#8B5CF6,#FFB800); color:white; border:none; border-radius:12px; font-weight:950; cursor:pointer;">
            تغییر رمز عبور
        </button>
    </form>
    {% else %}
    <p style="color:#c53030;">این لینک نامعتبر یا منقضی شده است.</p>
    {% endif %}
</div>
</div>
{% endblock %}
