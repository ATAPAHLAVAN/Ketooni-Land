{% extends 'shop/base.html' %}
{% block content %}
<style>
    .page-header { background: #f8f8f8; padding: 40px; border-bottom: 1px solid #e0e0e0; }
    .page-header h1 { font-size: 1.8rem; font-weight: 900; color: #1a1a1a; margin: 0; }
    .checkout-container { max-width: 1400px; margin: 0 auto; padding: 40px; }
    .checkout-grid { display: grid; grid-template-columns: 1fr 350px; gap: 40px; }
    .checkout-form { background: white; padding: 40px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: 1px solid #e0e0e0; }
    .form-section { margin-bottom: 30px; padding-bottom: 30px; border-bottom: 1px solid #e0e0e0; }
    .form-section:last-child { border-bottom: none; }
    .form-title { font-size: 1.1rem; font-weight: 900; color: #1a1a1a; margin: 0 0 20px 0; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-group { display: flex; flex-direction: column; }
    .form-label { font-weight: 700; color: #1a1a1a; margin-bottom: 6px; font-size: 0.9rem; }
    .form-input, .form-select { padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 0.9rem; transition: all 0.2s ease; }
    .form-input:focus, .form-select:focus { outline: none; border-color: #1a1a1a; }
    .form-full { grid-column: 1 / -1; }
    .order-summary { background: white; padding: 25px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: 1px solid #e0e0e0; height: fit-content; position: sticky; top: 20px; }
    .summary-title { font-size: 1.1rem; font-weight: 900; color: #1a1a1a; margin: 0 0 20px 0; padding-bottom: 12px; border-bottom: 1px solid #e0e0e0; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; color: #666; font-weight: 600; }
    .summary-total { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 2px solid #e0e0e0; font-size: 1.2rem; font-weight: 900; color: #1a1a1a; }
    .place-order-btn { width: 100%; background: #27ae60; color: white; border: none; padding: 14px; border-radius: 6px; font-weight: 900; font-size: 1rem; cursor: pointer; margin-top: 20px; transition: all 0.2s ease; }
    .place-order-btn:hover { background: #239a56; }
    @media (max-width: 1024px) { .checkout-grid { grid-template-columns: 1fr; } .order-summary { position: static; } }
    @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
</style>

<div class="page-header">
    <h1>تأیید سفارش</h1>
</div>

<div class="checkout-container">
    <div class="checkout-grid">
        <!-- Form -->
        <div class="checkout-form">
            <!-- Shipping -->
            <div class="form-section">
                <h3 class="form-title">آدرس تحویل</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">نام</label>
                        <input type="text" class="form-input" placeholder="نام کامل">
                    </div>
                    <div class="form-group">
                        <label class="form-label">شماره تماس</label>
                        <input type="tel" class="form-input" placeholder="09...">
                    </div>
                    <div class="form-group form-full">
                        <label class="form-label">آدرس</label>
                        <input type="text" class="form-input" placeholder="آدرس کامل">
                    </div>
                    <div class="form-group">
                        <label class="form-label">شهر</label>
                        <input type="text" class="form-input" placeholder="شهر">
                    </div>
                    <div class="form-group">
                        <label class="form-label">کد پستی</label>
                        <input type="text" class="form-input" placeholder="کد پستی">
                    </div>
                </div>
            </div>

            <!-- Payment -->
            <div class="form-section">
                <h3 class="form-title">روش پرداخت</h3>
                <div class="form-grid">
                    <div class="form-group form-full">
                        <label style="display: flex; align-items: center; gap: 10px; font-weight: 700; cursor: pointer;">
                            <input type="radio" name="payment" checked>
                            <span>درگاه پرداخت</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Notes -->
            <div class="form-section">
                <h3 class="form-title">یادداشت</h3>
                <textarea class="form-input form-full" rows="4" placeholder="یادداشت یا توضیح..."></textarea>
            </div>
        </div>

        <!-- Summary -->
        <div class="order-summary">
            <h3 class="summary-title">خلاصهٔ سفارش</h3>
            <div class="summary-row">
                <span>جمع:</span>
                <span>۱۵۰,۰۰۰ تومان</span>
            </div>
            <div class="summary-row">
                <span>حمل‌ونقل:</span>
                <span>رایگان</span>
            </div>
            <div class="summary-row">
                <span>مالیات:</span>
                <span>۰ تومان</span>
            </div>
            <div class="summary-total">
                <span>کل:</span>
                <span>۱۵۰,۰۰۰ تومان</span>
            </div>
            <button class="place-order-btn">تأیید و پرداخت</button>
        </div>
    </div>
</div>
{% endblock %}
