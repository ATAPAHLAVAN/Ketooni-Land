{% extends 'shop/base.html' %}
{% load static %}
{% block title %}ویرایش پروفایل - کتونی لند{% endblock %}
{% block content %}
<style>
    @keyframes gradientShift { 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }

    .edit-profile-header {
        background: linear-gradient(-45deg, #0a0e14, #1a202c, #2c1a3d, #1a202c);
        background-size: 300% 300%; animation: gradientShift 10s ease infinite;
        color: white; padding: 55px 40px; text-align: center; position: relative;
    }
    .edit-profile-header::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px;
        background: linear-gradient(90deg, transparent, #8B5CF6, #FFB800, #8B5CF6, transparent); }
    .edit-profile-header h1 { font-size: 2.3rem; font-weight: 950; }
    .edit-profile-header h1 span { background: linear-gradient(135deg, #8B5CF6, #FFB800);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    .edit-profile-container { padding: 50px 40px; max-width: 700px; margin: 0 auto; }
    .edit-profile-card { background: white; border-radius: 18px; padding: 40px; border: 2px solid #e2e8f0; }

    .avatar-upload-section { text-align: center; margin-bottom: 35px; }
    .current-avatar {
        width: 130px; height: 130px; border-radius: 50%; margin: 0 auto 15px;
        background: linear-gradient(135deg, #8B5CF6, #FFB800);
        display: flex; align-items: center; justify-content: center; font-size: 3rem;
        overflow: hidden; box-shadow: 0 10px 30px rgba(139,92,246,0.3); position: relative;
    }
    .current-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .avatar-upload-label {
        display: inline-block; padding: 10px 24px; background: white; color: #8B5CF6;
        border: 2px solid #8B5CF6; border-radius: 10px; font-weight: 900; cursor: pointer;
        transition: all .3s ease; font-size: 0.9rem;
    }
    .avatar-upload-label:hover { background: #8B5CF6; color: white; }
    .avatar-upload-input { display: none; }
    .avatar-filename { color: #718096; font-size: 0.85rem; margin-top: 8px; }

    .form-group-pro { margin-bottom: 20px; }
    .form-group-pro label { display: block; margin-bottom: 8px; font-weight: 900; color: #1a202c; font-size: 0.95rem; }
    .form-group-pro input, .form-group-pro textarea {
        width: 100%; padding: 13px 16px; border: 2px solid #e2e8f0; border-radius: 12px;
        font-size: 0.95rem; transition: all .3s ease; background: #f7fafc; font-family: inherit;
    }
    .form-group-pro input:focus, .form-group-pro textarea:focus {
        outline: none; border-color: #8B5CF6; background: white; box-shadow: 0 0 0 4px rgba(139,92,246,0.12);
    }
    .form-group-pro textarea { resize: vertical; min-height: 90px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    .save-btn {
        width: 100%; padding: 15px; background: linear-gradient(135deg, #8B5CF6, #FFB800);
        color: white; border: none; border-radius: 12px; font-weight: 950; font-size: 1rem;
        cursor: pointer; transition: all .4s ease; margin-top: 15px; position: relative; overflow: hidden;
    }
    .save-btn::before {
        content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent); transition: left 0.5s ease;
    }
    .save-btn:hover::before { left: 100%; }
    .save-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(139,92,246,0.4); }

    .cancel-link {
        display: block; text-align: center; margin-top: 15px; color: #718096;
        text-decoration: none; font-weight: 700; font-size: 0.9rem;
    }
    .cancel-link:hover { color: #8B5CF6; }

    @media (max-width: 600px) {
        .edit-profile-card { padding: 25px; }
        .form-row { grid-template-columns: 1fr; }
    }
</style>

<div class="edit-profile-header">
    <h1>ویرایش <span>پروفایل</span></h1>
</div>

<div class="edit-profile-container">
    <div class="edit-profile-card">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="avatar-upload-section">
                <div class="current-avatar" id="avatarPreview">
                    {% if profile.avatar %}
                        <img src="{{ profile.avatar.url }}" alt="عکس پروفایل">
                    {% else %}
                        👤
                    {% endif %}
                </div>
                <label for="avatarInput" class="avatar-upload-label">آپلود عکس جدید</label>
                <input type="file" name="avatar" id="avatarInput" class="avatar-upload-input" accept="image/*" onchange="previewAvatar(this)">
                <div class="avatar-filename" id="avatarFilename"></div>
            </div>

            <div class="form-row">
                <div class="form-group-pro">
                    <label>نام</label>
                    <input type="text" name="first_name" value="{{ request.user.first_name }}" placeholder="نام خود را وارد کنید">
                </div>
                <div class="form-group-pro">
                    <label>نام خانوادگی</label>
                    <input type="text" name="last_name" value="{{ request.user.last_name }}" placeholder="نام خانوادگی خود را وارد کنید">
                </div>
            </div>

            <div class="form-group-pro">
                <label>ایمیل</label>
                <input type="email" name="email" value="{{ request.user.email }}" placeholder="ایمیل خود را وارد کنید">
            </div>

            <div class="form-group-pro">
                <label>شماره تلفن</label>
                <input type="text" name="phone" value="{{ profile.phone|default:'' }}" placeholder="09120000000">
            </div>

            <div class="form-group-pro">
                <label>دربارهٔ من</label>
                <textarea name="bio" placeholder="چند خط دربارهٔ خودتان بنویسید...">{{ profile.bio|default:'' }}</textarea>
            </div>

            <button type="submit" class="save-btn">ذخیرهٔ تغییرات</button>
            <a href="{% url 'userprofile:profile' %}" class="cancel-link">انصراف و بازگشت</a>
        </form>
    </div>
</div>

<script>
function previewAvatar(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('avatarPreview').innerHTML = `<img src="${e.target.result}" alt="پیش‌نمایش">`;
        };
        reader.readAsDataURL(input.files[0]);
        document.getElementById('avatarFilename').textContent = input.files[0].name;
    }
}
</script>
{% endblock %}
